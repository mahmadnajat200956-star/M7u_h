<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music_m1c_d</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap');

        :root {
            --bg-main: #090d16;
            --bg-card: #121826;
            --bg-pill: #182032;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 14px 30px;
            overflow-x: hidden;
        }

        /* شريط الحقوق العلوي */
        .dev-pill {
            background: var(--bg-pill);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 20px;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            direction: ltr;
        }

        .dev-pill a {
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .dev-pill a:active {
            transform: scale(0.9);
        }

        .dev-pill svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .dev-username {
            color: var(--accent);
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        /* بطاقة المشغل الرئيسية */
        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 22px 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 18px;
        }

        .cover-wrapper {
            width: 195px;
            height: 195px;
            border-radius: 24px;
            background: #0d131f;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
            position: relative;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .default-icon {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 2px solid rgba(14, 165, 233, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
        }

        .song-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 18px;
        }

        /* أزرار التعديل الثلاثة */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-bottom: 20px;
        }

        .action-btn {
            background: #172033;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 6px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .action-btn:active {
            transform: scale(0.96);
            background: #1e293b;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        /* شريط التقدم (مضبوط LTR ليتطابق اللون مع النقطة 100%) */
        .progress-section {
            width: 100%;
            margin-bottom: 18px;
            direction: ltr;
        }

        .seek-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: #232d42;
            outline: none;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--accent);
            box-shadow: 0 0 10px var(--accent);
            cursor: pointer;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* أزرار التحكم بالتشغيل */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 6px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: color 0.2s, transform 0.15s;
        }

        .ctrl-btn.active {
            color: var(--accent);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .nav-btn {
            background: #172033;
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
        }

        .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 22px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .play-btn:active {
            transform: scale(0.94);
        }

        /* قسم قائمة الأغاني وزر السماح */
        .library-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        .library-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .library-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: rgba(14, 165, 233, 0.15);
            color: var(--accent);
            font-size: 12px;
            padding: 2px 9px;
            border-radius: 20px;
        }

        .import-btn {
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(14, 165, 233, 0.4);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .import-btn:active {
            transform: scale(0.96);
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .song-item {
            background: #161e2e;
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .song-item.active {
            border-color: var(--accent);
            background: rgba(14, 165, 233, 0.08);
        }

        .item-thumb {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #0d131f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            color: var(--accent);
        }

        .item-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-size {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* النوافذ المنبثقة (تعديل الاسم وقص الأغنية) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            background: #0d131f;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        .trim-row {
            margin-bottom: 12px;
        }

        .trim-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-primary {
            flex: 1;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 11px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-secondary {
            flex: 1;
            background: #1e293b;
            color: var(--text-primary);
            border: none;
            border-radius: 12px;
            padding: 11px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 24px 10px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.7;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            background: #1e293b;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid var(--accent);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 200;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
