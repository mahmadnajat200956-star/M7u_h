<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لێدەری میوزیک | @m1c_d</title>
    <!-- بارکردنی Tailwind CSS بۆ دیزاینی مۆدێرن و گونجاو لەگەڵ مۆبایل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- فۆنتی کوردی سۆرانی (Vazirmatn & Noto Sans Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'Noto Sans Arabic', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0b0e14',
                        cardBg: '#141923',
                        pillBg: '#171d29',
                        brandBlue: '#1d9bf0',
                        cyanAccent: '#38bdf8',
                    }
                }
            }
        }
    </script>

    <style>
        /* ڕێکخستنە گشتییەکان و ڕەنگە تاریکەکان */
        body {
            background-color: #0b0e14;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(29, 155, 240, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(56, 189, 248, 0.06) 0%, transparent 45%);
            color: #f8fafc;
            font-family: 'Vazirmatn', 'Noto Sans Arabic', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* دیزاینی شریتی سکڕۆڵ */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1d9bf0;
        }

        /* درەوشانەوەی دوگمەی سەرەکی لێدان */
        .play-btn-glow {
            background: linear-gradient(135deg, #1d9bf0 0%, #38bdf8 100%);
            box-shadow: 0 0 25px rgba(29, 155, 240, 0.45), 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
        }
        .play-btn-glow:hover {
            transform: scale(1.05);
            box-shadow: 0 0 32px rgba(56, 189, 248, 0.65), 0 10px 25px rgba(0, 0, 0, 0.6);
        }
        .play-btn-glow:active {
            transform: scale(0.95);
        }

        /* درەوشانەوەی وێنەی گۆرانی */
        .cover-shadow {
            box-shadow: 0 18px 40px -10px rgba(0, 0, 0, 0.85), 0 0 25px rgba(29, 155, 240, 0.12);
        }

        /* شریتی پێشکەوتن و بڕین (Range Sliders) */
        input[type="range"].custom-slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"].custom-slider::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
        }
        input[type="range"].custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #1d9bf0;
            box-shadow: 0 0 10px rgba(29, 155, 240, 0.85);
            margin-top: -5px;
            transition: transform 0.15s ease;
        }
        input[type="range"].custom-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* جوڵەی شەپۆلی دەنگ لە لیستی گۆرانییەکان */
        @keyframes soundWave {
            0%, 100% { height: 4px; }
            50% { height: 15px; }
        }
        .wave-active .w-bar-1 { animation: soundWave 0.75s ease-in-out infinite; }
        .wave-active .w-bar-2 { animation: soundWave 0.55s ease-in-out infinite 0.2s; }
        .wave-active .w-bar-3 { animation: soundWave 0.85s ease-in-out infinite 0.1s; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- ١. کەپسولی مافی گەشەپێدەر لە سەرەوەی بەرنامە (@m1c_d) -->
    <header class="w-full pt-4 pb-2 px-4 flex flex-col items-center justify-center sticky top-0 z-30 bg-[#0b0e14]/85 backdrop-blur-md">
        <div dir="ltr" onclick="copyDeveloperUsername()" title="کرتە بکە بۆ کۆپیکردنی @m1c_d"
             class="cursor-pointer group inline-flex items-center gap-4 px-6 py-2.5 rounded-full bg-[#171d29] border border-white/10 shadow-xl hover:border-[#1d9bf0]/50 transition-all duration-300">
            
            <!-- ئایکۆنی سناپچات (سپی) -->
            <a href="https://www.snapchat.com/add/m1c_d" target="_blank" onclick="event.stopPropagation()" aria-label="Snapchat"
               class="text-white hover:text-[#1d9bf0] transition-transform hover:scale-110">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12.206 2.024c-2.613-.06-4.888 1.564-5.466 4.14-.226 1.007-.124 2.138-.035 3.128.023.257.046.506.058.742-.262.136-.576.197-.893.197-.39 0-.772-.11-1.082-.252-.236-.108-.5-.13-.748-.055-.423.128-.69.54-.635.98.055.442.426.783.88.88.395.084.828.22 1.157.448.198.138.282.345.217.568-.317 1.093-1.158 2.275-2.642 2.948-.373.17-.576.572-.482.972.094.4.442.685.853.713.864.06 1.637.243 2.155.524.217.118.353.337.392.582.067.42.263.845.675 1.01.412.164.887.053 1.375-.06.56-.13 1.195-.277 1.88-.277.69 0 1.326.147 1.886.277.488.113.963.224 1.375.06.412-.165.608-.59.675-1.01.039-.245.175-.464.392-.582.518-.28 1.29-.464 2.155-.524.41-.028.759-.313.853-.713.094-.4-.109-.802-.482-.972-1.484-.673-2.325-1.855-2.642-2.948-.065-.223.02-.43.217-.568.33-.228.762-.364 1.157-.448.454-.097.825-.438.88-.88.055-.44-.212-.852-.635-.98-.248-.075-.512-.053-.748.055-.31.142-.692.252-1.082.252-.317 0-.63-.06-.893-.197.012-.236.035-.485.058-.742.089-.99.191-2.121-.035-3.128-.578-2.576-2.853-4.2-5.466-4.14z"/>
                </svg>
            </a>

            <!-- ئایکۆنی تێلیگرام (سپی) -->
            <a href="https://t.me/m1c_d" target="_blank" onclick="event.stopPropagation()" aria-label="Telegram"
               class="text-white hover:text-[#1d9bf0] transition-transform hover:scale-110">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                </svg>
            </a>

            <!-- ئایکۆنی تیک تۆک (سپی) -->
            <a href="https://www.tiktok.com/@m1c_d" target="_blank" onclick="event.stopPropagation()" aria-label="TikTok"
               class="text-white hover:text-[#1d9bf0] transition-transform hover:scale-110">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
            </a>

            <!-- یوزەری گەشەپێدەر بە ڕەنگی شین -->
            <span class="text-[#1d9bf0] font-bold text-base tracking-wide group-hover:text-[#38bdf8] transition-colors">
                @m1c_d
            </span>
        </div>
    </header>

    <!-- ناوەڕۆکی سەرەکی بەرنامە -->
    <main class="w-full max-w-lg mx-auto px-4 pt-2 pb-10 flex-1 flex flex-col">

        <!-- ==================== ٢. شاشەی پێشوازی و ڕێگەپێدان بە گۆرانییەکانی ناو ئامێر ==================== -->
        <section id="permissionScreen" class="flex-1 flex flex-col items-center justify-center text-center py-10 px-3">
            <div class="w-24 h-24 rounded-3xl bg-[#141923] border border-[#1d9bf0]/30 flex items-center justify-center mb-6 shadow-2xl relative">
                <div class="absolute inset-0 rounded-3xl bg-[#1d9bf0]/10 animate-pulse"></div>
                <svg class="w-12 h-12 text-[#1d9bf0]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                </svg>
            </div>

            <h1 class="text-2xl font-extrabold text-white mb-2">لێدەری میوزیکی سادە و پڕۆفیشناڵ</h1>
            <p class="text-sm text-slate-400 leading-relaxed max-w-sm mb-8">
                بۆ پیشاندان و لێدانی هەموو گۆرانی و فایلە دەنگییەکانی ناو مۆبایل و ئامێرەکەت، تکایە ڕێگەپێدان بدە بۆ گەڕان لەناو فایلەکاندا.
            </p>

            <!-- دوگمەی سەرەکی ڕێگەپێدان بە گەڕان لە فۆڵدەر و ئامێر -->
            <button onclick="requestDeviceMusicAccess()" class="w-full max-w-xs py-4 px-6 rounded-2xl play-btn-glow text-white font-bold text-base flex items-center justify-center gap-3 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                </svg>
                <span>ڕێگەپێدان بە گەڕان بۆ گۆرانییەکان</span>
            </button>

            <!-- بژاردەی یەدەگ بۆ هەڵبژاردنی ڕاستەوخۆی فایلە دەنگییەکان -->
            <button onclick="triggerDirectFilesPicker()" class="text-xs text-slate-400 hover:text-[#38bdf8] py-2 px-4 transition">
                یان هەڵبژاردنی گۆرانییەکان بە شێوەی دەستی
            </button>
        </section>

        <!-- ==================== ٣. شاشەی سەرەکی لێدەر و لیستی گۆرانییەکان ==================== -->
        <section id="playerWorkspace" class="hidden flex-col space-y-5">

            <!-- کارتی لێدەری سەرەکی (Main Player Card) -->
            <div class="bg-[#141923] border border-white/10 rounded-3xl p-5 shadow-2xl">
                
                <!-- بەشی سەرەوەی کارت: وێنەی گۆرانی + ناوی گۆرانی + ٣ دوگمە سەرەکییەکە -->
                <div class="flex flex-col items-center text-center">
                    
                    <!-- وێنەی گۆرانی (چوارگۆشەی گۆشە خڕ) -->
                    <div onclick="triggerCoverUpload()" title="کرتە بکە بۆ گۆڕینی وێنەی گۆرانی"
                         class="relative group w-48 h-48 sm:w-56 sm:h-56 rounded-3xl overflow-hidden bg-[#0b0e14] border border-white/10 cover-shadow cursor-pointer mb-4">
                        <img id="mainCoverImg" src="" alt="وێنەی گۆرانی" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                        
                        <!-- چینی سەرەوە بۆ گۆڕینی وێنە -->
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center backdrop-blur-[2px]">
                            <svg class="w-7 h-7 text-white mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            <span class="text-xs font-bold text-white">گۆڕینی وێنە</span>
                        </div>
                    </div>

                    <!-- ناوی گۆرانی -->
                    <h2 id="mainSongTitle" class="text-lg sm:text-xl font-extrabold text-white line-clamp-1 px-2 mb-1">
                        ناوی گۆرانی
                    </h2>
                    <p id="mainSongMeta" class="text-xs text-slate-400 mb-4">
                        فایلی دەنگی ناو ئامێر
                    </p>

                    <!-- سێ تایبەتمەندییە داواکراوەکە بە سادەیی و ڕوونی: گۆڕینی وێنە، گۆڕینی ناو، بڕینی گۆرانی -->
                    <div class="w-full grid grid-cols-3 gap-2 mb-5">
                        <button onclick="triggerCoverUpload()" class="py-2.5 px-2 rounded-2xl bg-[#0b0e14] hover:bg-[#1a2232] border border-white/10 text-xs font-semibold text-slate-200 flex items-center justify-center gap-1.5 transition active:scale-95">
                            <svg class="w-4 h-4 text-[#38bdf8] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span>گۆڕینی وێنە</span>
                        </button>

                        <button onclick="openRenameModal()" class="py-2.5 px-2 rounded-2xl bg-[#0b0e14] hover:bg-[#1a2232] border border-white/10 text-xs font-semibold text-slate-200 flex items-center justify-center gap-1.5 transition active:scale-95">
                            <svg class="w-4 h-4 text-[#1d9bf0] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                            <span>گۆڕینی ناو</span>
                        </button>

                        <button onclick="openTrimmerModal()" class="py-2.5 px-2 rounded-2xl bg-[#0b0e14] hover:bg-[#1a2232] border border-white/10 text-xs font-semibold text-slate-200 flex items-center justify-center gap-1.5 transition active:scale-95">
                            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"/>
                            </svg>
                            <span>بڕینی گۆرانی</span>
                        </button>
                    </div>
                </div>

                <!-- شریتی پێشکەوتنی گۆرانی و کات -->
                <div class="w-full mb-5">
                    <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1"
                           oninput="handleSeek(this.value)"
                           class="custom-slider w-full h-1.5 rounded-lg bg-slate-800">
                    <div dir="ltr" class="flex justify-between text-[11px] font-medium text-slate-400 mt-2">
                        <span id="currentTimeText">0:00</span>
                        <span id="totalTimeText">0:00</span>
                    </div>
                </div>

                <!-- دوگمەکانی کۆنترۆڵکردنی لێدان -->
                <div class="flex items-center justify-between px-1">
                    <!-- دووبارەکردنەوە -->
                    <button id="repeatBtn" onclick="toggleRepeat()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition" title="دووبارەکردنەوە">
                        <div class="p-2 rounded-full bg-[#0b0e14] border border-white/5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                        </div>
                        <span class="text-[10px]">دووبارە</span>
                    </button>

                    <!-- پێشوو -->
                    <button onclick="playPrevious()" class="w-11 h-11 rounded-full bg-[#0b0e14] border border-white/10 flex items-center justify-center text-white hover:bg-[#1d2534] active:scale-95 transition" title="پێشوو">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>

                    <!-- لێدان / وەستان -->
                    <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full play-btn-glow flex items-center justify-center text-white">
                        <svg id="iconPlay" class="w-8 h-8 fill-current ml-0.5" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="iconPause" class="w-8 h-8 fill-current hidden" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>

                    <!-- دواتر -->
                    <button onclick="playNext()" class="w-11 h-11 rounded-full bg-[#0b0e14] border border-white/10 flex items-center justify-center text-white hover:bg-[#1d2534] active:scale-95 transition" title="دواتر">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>

                    <!-- تێکەڵکردن -->
                    <button id="shuffleBtn" onclick="toggleShuffle()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition" title="تێکەڵکردن">
                        <div class="p-2 rounded-full bg-[#0b0e14] border border-white/5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
                            </svg>
                        </div>
                        <span class="text-[10px]">تێکەڵکردن</span>
                    </button>
                </div>
            </div>

            <!-- بەشی لیستی هەموو گۆرانییەکانی ناو ئامێر -->
            <div class="bg-[#141923] border border-white/10 rounded-3xl p-4 shadow-xl">
                
                <!-- سەردێڕ و دوگمەی زیادکردنی فۆڵدەر یان گۆرانی -->
                <div class="flex items-center justify-between gap-2 mb-3">
                    <div class="flex items-center gap-2">
                        <h3 class="text-sm font-bold text-white">گۆرانییەکانم</h3>
                        <span id="songsCountBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-[#1d9bf0]/15 text-[#38bdf8]">0</span>
                    </div>

                    <button onclick="requestDeviceMusicAccess()" class="text-xs font-semibold text-[#1d9bf0] hover:text-[#38bdf8] bg-[#0b0e14] border border-[#1d9bf0]/30 px-3 py-1.5 rounded-xl transition">
